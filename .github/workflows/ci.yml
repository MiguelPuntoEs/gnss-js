name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BKG/ESA are intermittently unreachable from GitHub runners; the
      # fetch script skips existing files, so a cache hit is a no-op.
      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: test-fixtures
          key: test-data-${{ hashFiles('scripts/fetch-test-data.sh') }}
          restore-keys: |
            test-data-
      - run: bash scripts/fetch-test-data.sh
      - run: pnpm run lint
      - run: npx tsc --noEmit
      - run: pnpm test
      # Dates hold the GPS clock face in their UTC fields; a stray local-time
      # getter only shows away from UTC (gnss-js#2), so rerun the time tests
      # west and far east of Greenwich.
      - name: Time tests outside UTC
        run: |
          for tz in America/Los_Angeles Pacific/Kiritimati; do
            TZ=$tz pnpm exec vitest run test/time-correctness.test.ts test/gnss-scales.test.ts test/functions.test.ts test/julian.test.ts test/time-rinex.test.ts test/rinex.test.ts test/time-difference.test.ts
          done
      - run: pnpm run build
